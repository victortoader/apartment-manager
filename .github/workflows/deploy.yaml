name: Test and deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: apartment-manager-production
  cancel-in-progress: false

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Grant execution permission to Gradle
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew test --no-daemon

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E tests
    needs: test-backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle

      - name: Grant execution permission to Gradle
        run: chmod +x gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend
        env:
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
        run: |
          ./gradlew bootRun --no-daemon > backend.log 2>&1 &
          echo "Waiting for backend on :8080..."
          for i in $(seq 1 300); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/login || echo 000)
            if [ "$code" != "000" ]; then
              echo "Backend is up (HTTP $code)"
              break
            fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/login || echo 000)
          if [ "$code" = "000" ]; then
            echo "Backend failed to start"
            tail -200 backend.log
            exit 1
          fi

      - name: Run Playwright e2e tests
        working-directory: frontend
        env:
          DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to EC2
    needs:
      - test-backend
      - build-frontend
      - e2e

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            "$EC2_USER@$EC2_HOST" \
            "bash /home/ubuntu/apartment-manager/scripts/deploy.sh"